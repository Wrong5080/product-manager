<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Product Manager Pro</title>

</head>

<body>

    <div class="app">

        <div class="header-section">

            <h1>Product Manager</h1>

            <p class="subtitle">Pro Edition • JavaScript & Local Storage</p>

        </div>
    
        <div class="form-box">
        
            <input type="text" id="productName" placeholder="Product name" autocomplete="off">
        
            <div class="input-row">
            
                <input type="number" id="productPrice" placeholder="Price ($)" min="0" step="0.01">
            
                <input type="number" id="productQuantity" placeholder="Quantity" min="0">
            
            </div>
            
            <button id="saveBtn">Save Product</button>
            
            <p id="message"></p>

        </div>

        <div class="list-box">

            <div class="list-header">

                <h2>Inventory</h2>

            </div>

            <div id="productList"></div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
